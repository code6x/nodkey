# The manifest of the pullgate recipe of nodkey (docs/setup.md, "Change
# the config from git with pullgate"). scripts/build-release.sh writes
# the version of the release into it; pullgate checks that it is the tag
# of the release.
format = 1
version = "0.0.0"

# The broker config instance: broker.toml and known_hosts from a config
# repo.
[[instance]]
name = "nodkey-broker"
config = "nodkey-broker.toml.in"
requires = ["nodkey", "flock", "systemctl", "sha256sum", "setpriv"]
setup = ["setup.sh", "broker"]

# The host instance: host.yml (the version of nodkey and the settings of
# the role) from a data repo, applied with the Ansible recipe.
[[instance]]
name = "nodkey-host"
config = "nodkey-host.toml.in"
requires = ["nodkey", "flock", "systemctl", "sha256sum", "setpriv", "python3", "ansible-playbook", "curl", "tar"]
setup = ["setup.sh", "host"]
