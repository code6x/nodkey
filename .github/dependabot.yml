version: 2
updates:
  # Pull request titles look like "chore(deps): bump ...". The chore type
  # makes no release. A fix for a known security problem is retitled
  # "security(deps): ...". See docs/releasing.md.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Wait 7 days after a new version comes out, so that a bad release can
    # be found and pulled first. Security updates do not wait.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope

  # The base image of the SSH targets of the end-to-end test, pinned by
  # its digest. Dependabot updates the digest. Pull request titles look
  # like "test(deps): bump debian ...".
  - package-ecosystem: docker
    directory: /test/e2e/testdata/sshd
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: test
      include: scope

  # Pull request titles look like "ci(deps): bump actions/checkout ...".
  # Dependabot also updates the pinned commit SHA and its version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
