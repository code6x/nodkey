name: Release

# How releases work, and the one-time setup: docs/releasing.md.

on:
  push:
    branches: [main]

# Each job asks for only the permissions it needs.
permissions: {}

concurrency:
  # One release run at a time. Never cancel a run in the middle of a release.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    # Skip until the GitHub App is set up (see docs/releasing.md).
    if: vars.RELEASE_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    # The App private key is a secret of this environment. Only main may use
    # the environment, so only runs on main can read the key.
    environment: release
    # This job uses the App token, not GITHUB_TOKEN.
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Builds the files. It can only read the repository: no OIDC token, and no
  # write access to the release.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Check that the tag is the commit of this run
        # The provenance attestation names $GITHUB_SHA as the source commit.
        # Build only that commit.
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          tagged="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          echo "HEAD: $head  tag ${TAG}: $tagged  run: $GITHUB_SHA"
          if [ "$head" != "$GITHUB_SHA" ] || [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::The tag ${TAG} is not the commit of this run. See docs/releasing.md."
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The newest Go, so the binaries get the newest standard library fixes.
          go-version: stable
          # No cache for release builds: a bad cache entry could change the binaries.
          cache: false
      - name: Build
        # scripts/build-release.sh is the one build of the release files.
        # The Release check workflow builds a candidate with it too.
        run: sh scripts/build-release.sh "$VERSION" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error

  # Signs the files from the build job and adds them to the draft release.
  # It runs no code from the repository. It does not publish: verify checks
  # the draft's files first.
  upload:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    outputs:
      # The SHA-256 and the name of each file of the draft that verify gets.
      files: ${{ steps.draft.outputs.files }}
    permissions:
      contents: write # upload the files to the draft release
      id-token: write # sign the attestation (Sigstore)
      attestations: write # store the attestation
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Check the files and the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --strict -c SHA256SUMS)
          # The version names the bundle file. An empty or wrong version
          # would go out in a release that nobody can change.
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "::error::The tag ${TAG} does not match the version ${VERSION}. See docs/releasing.md."
            exit 1
          fi
          tagged="$(gh api "repos/${GITHUB_REPOSITORY}/commits/refs/tags/${TAG}" --jq .sha)"
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::The tag ${TAG} points to ${tagged}, not to ${GITHUB_SHA}. See docs/releasing.md."
            exit 1
          fi
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-path: dist/*.tar.gz
      # The attestation is also a file of the release. With this file,
      # gh attestation verify --bundle needs no GitHub login. One bundle
      # covers all tarballs. The same bundle is also published as
      # nodkey_X.Y.Z_pullgate.sigstore.json: pullgate recipe fetch looks
      # for the bundle of FILE.tar.gz under the name FILE.sigstore.json.
      - name: Save the attestation bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp -- "$BUNDLE" "dist/nodkey_${VERSION}.sigstore.json"
          cp -- "$BUNDLE" "dist/nodkey_${VERSION}_pullgate.sigstore.json"
      # The same check as in docs/releasing.md, with no login. A bundle that
      # fails it never goes out: the release stays a draft.
      - name: Check the tarballs with the bundle
        run: |
          set -euo pipefail
          gh --version
          for f in dist/*.tar.gz; do
            gh attestation verify "$f" \
              --bundle "dist/nodkey_${VERSION}.sigstore.json" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main" \
              --deny-self-hosted-runners
            echo "$f: OK"
          done
      # release-please made a draft release (see release-please-config.json).
      # Add the files first and publish after that, so the release is never
      # public without its files. Immutable releases need this order.
      - name: Upload the files to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS "dist/nodkey_${VERSION}.sigstore.json" "dist/nodkey_${VERSION}_pullgate.sigstore.json" --clobber --repo "$GITHUB_REPOSITORY"
      # The files of a draft can only be read with write access, so this
      # job gets them back, and verify, which can only read, checks them.
      - name: Download the files of the draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --dir draft --repo "$GITHUB_REPOSITORY"
          # publish compares this list with the assets of the draft, so it
          # publishes only the files that verify checked.
          echo "files=$(cd draft && sha256sum -- * | LC_ALL=C sort -k2 | sha256sum | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: draft-files
          path: draft/
          if-no-files-found: error

  # The verify gate: checks the files of the draft as a user would
  # (verify-release.yml, docs/releasing.md "The verify gate"). It can only
  # read. When it fails, the release stays a draft.
  verify:
    needs: [release-please, upload]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
      artifact: draft-files

  # Publishes the draft release, only after verify passed. It runs no code
  # from the repository.
  publish:
    needs: [release-please, upload, verify]
    if: needs.release-please.outputs.release_created == 'true' && needs.verify.outputs.verified == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the draft release
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Check that the draft still has the verified files
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ needs.upload.outputs.files }}
        run: |
          set -euo pipefail
          # The digest of each asset, in the form of sha256sum. An asset
          # without a digest gives an empty line, and the check fails.
          now="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\((.digest // "") | ltrimstr("sha256:"))  \(.name)"' | LC_ALL=C sort -k2 | sha256sum | cut -d' ' -f1)"
          if [ -z "$FILES" ] || [ "$now" != "$FILES" ]; then
            echo "::error::The files of the draft changed after verify checked them. Nothing is published. See docs/releasing.md."
            exit 1
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
