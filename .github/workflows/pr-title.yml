name: PR title

# The squash merge uses the pull request title as the commit message, and
# release-please reads those messages. So the title must follow
# Conventional Commits. See docs/releasing.md.

on:
  # pull_request_target also runs for pull requests from forks. It runs with
  # this repository's token, so this workflow must never check out or run
  # code from the pull request. It only reads the title.
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read # read the pull request

concurrency:
  # Check only the newest title of a pull request.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            chore
            ci
            test
            refactor
            build
            style
