name: Release check

# Checks a release candidate against the last releases, before the owner
# merges the release pull request. Run it by hand, on the branch of the
# release pull request (release-please--branches--main), only when you
# want to release: Actions, "Release check", "Run workflow". It builds
# and checks; it publishes nothing and needs no secret. How to run it and
# how to read the result: docs/releasing.md, "Check a release candidate".

on:
  workflow_dispatch:

# Each job asks for only the permissions it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Check 1 and 2: builds the candidate with the build of release.yml,
  # and finds and checks N-1 and N-2.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # read the repository and its releases
    outputs:
      version: ${{ steps.version.outputs.version }}
      n1: ${{ steps.previous.outputs.n1 }}
      n2: ${{ steps.previous.outputs.n2 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags: install.sh of N-1 and N-2, and the changelog check.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The same Go as release.yml, and no cache, as there.
          go-version: stable
          cache: false
      - name: The candidate
        id: version
        run: |
          set -euo pipefail
          version="$(jq -r '."."' .release-please-manifest.json)"
          if ! printf '%s\n' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::.release-please-manifest.json has no version X.Y.Z. Run this workflow on the branch of the release pull request."
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          {
            echo "candidate commit: $GITHUB_SHA"
            echo "branch: $GITHUB_REF_NAME"
            echo "version: $version"
            go version
          } | tee candidate.txt
          if [ "$GITHUB_REF_NAME" != "release-please--branches--main" ]; then
            echo "::warning::This run is not on the branch of the release pull request: the changelog check will fail."
          fi
      - name: Check 1, build the candidate with scripts/build-release.sh
        id: check1
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sh scripts/build-release.sh "$VERSION" dist | tee build.txt
          # A second build of the same commit must give the same files.
          sh scripts/build-release.sh "$VERSION" "${RUNNER_TEMP}/again" >/dev/null
          diff dist/SHA256SUMS "${RUNNER_TEMP}/again/SHA256SUMS"
          echo "a second build gives the same files" | tee -a build.txt
          # The pullgate tarball is a recipe of this version, as pullgate
          # reads it (scripts/release-check/recipe.sh).
          sh scripts/release-check/recipe.sh "dist/nodkey_${VERSION}_pullgate.tar.gz" "$VERSION" | tee -a build.txt
      - name: Check 2, find N-1 and N-2, and check their files
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # In two steps, so a failure of gh api stops the job.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" >"${RUNNER_TEMP}/releases.json"
          sh scripts/release-check/previous.sh "$VERSION" <"${RUNNER_TEMP}/releases.json" >"${RUNNER_TEMP}/previous"
          read -r n1 n2 <"${RUNNER_TEMP}/previous"
          echo "N-1: ${n1}  N-2: ${n2:-none}" | tee previous.txt
          echo "n1=$n1" >>"$GITHUB_OUTPUT"
          echo "n2=${n2:-}" >>"$GITHUB_OUTPUT"
          for v in $n1 ${n2:-}; do
            d="previous/$v"
            mkdir -p "$d"
            gh release download "v$v" --repo "$GITHUB_REPOSITORY" --dir "$d" \
              -p "nodkey_${v}_linux_amd64.tar.gz" -p SHA256SUMS -p "nodkey_${v}.sigstore.json"
            (cd "$d" && sha256sum --strict --ignore-missing -c SHA256SUMS)
            # The same check as docs/releasing.md, "Verify a download".
            gh attestation verify "$d/nodkey_${v}_linux_amd64.tar.gz" \
              --bundle "$d/nodkey_${v}.sigstore.json" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main" \
              --deny-self-hosted-runners
            tar -xzf "$d/nodkey_${v}_linux_amd64.tar.gz" -C "$d" nodkey
            git show "v$v:install.sh" >"$d/install.sh"
            echo "$v: $("$d/nodkey" version --offline)" | tee -a previous.txt
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: previous
          path: previous/
          if-no-files-found: error
      - name: Results of check 1 and 2
        if: always()
        run: |
          set -eu
          mkdir -p results
          cat candidate.txt build.txt >evidence1.txt 2>/dev/null || true
          sh scripts/release-check/fragment.sh "1 build" "${{ steps.check1.outcome == 'success' && 'pass' || 'fail' }}" evidence1.txt results/1.json
          sh scripts/release-check/fragment.sh "2 N-1 and N-2" "${{ steps.previous.outcome == 'success' && 'pass' || 'fail' }}" previous.txt results/2.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          # A re-run of the job replaces the result of the first run.
          overwrite: true
          name: result-build
          path: results/

  # Check 3: N-1 and N-2 update to the candidate; a broken release is refused.
  update-path:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      N1: ${{ needs.build.outputs.n1 }}
      N2: ${{ needs.build.outputs.n2 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: previous
          path: previous
      - name: Check 3, the update path
        id: check
        run: |
          set -euo pipefail
          olds=()
          for v in $N1 $N2; do
            chmod 755 "previous/$v/nodkey"
            olds+=("$v:$PWD/previous/$v/nodkey:$PWD/previous/$v/install.sh")
          done
          sh scripts/release-check/update-path.sh "$PWD/dist" "$VERSION" "${olds[@]}" 2>&1 | tee evidence.txt
      - name: Result
        if: always()
        run: |
          mkdir -p results
          sh scripts/release-check/fragment.sh "3 update path" "${{ steps.check.outcome == 'success' && 'pass' || 'fail' }}" evidence.txt results/3.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          # A re-run of the job replaces the result of the first run.
          overwrite: true
          name: result-update-path
          path: results/

  # Check 4: the configs that N-1 accepts load with the candidate the same way.
  configs:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      N1: ${{ needs.build.outputs.n1 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: previous
          path: previous
      - name: Check 4, configs
        id: check
        run: |
          set -euo pipefail
          tar -xzf "dist/nodkey_${VERSION}_linux_amd64.tar.gz" -C dist nodkey
          chmod 755 "previous/$N1/nodkey"
          sh scripts/release-check/configs.sh "$PWD/previous/$N1/nodkey" "$PWD/dist/nodkey" 2>&1 | tee evidence.txt
      - name: Result
        if: always()
        run: |
          mkdir -p results
          sh scripts/release-check/fragment.sh "4 configs" "${{ steps.check.outcome == 'success' && 'pass' || 'fail' }}" evidence.txt results/4.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          # A re-run of the job replaces the result of the first run.
          overwrite: true
          name: result-configs
          path: results/

  # Check 5 and 6: the end-to-end test with the real binaries. Check 5:
  # N-1 writes the audit log, stops, and the candidate goes on with it.
  # Check 6: the three mixes of versions.
  e2e:
    needs: build
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "5 audit log N-1 then candidate", check: 5, first: n1, broker: cand, client: cand }
          - { name: "6 candidate broker, candidate client", check: 6a, first: "", broker: cand, client: cand }
          - { name: "6 N-1 broker, candidate client", check: 6b, first: "", broker: n1, client: cand }
          - { name: "6 candidate broker, N-1 client", check: 6c, first: "", broker: cand, client: n1 }
    env:
      VERSION: ${{ needs.build.outputs.version }}
      N1: ${{ needs.build.outputs.n1 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: previous
          path: previous
      - name: Check ${{ matrix.check }}, the end-to-end test
        id: check
        env:
          FIRST: ${{ matrix.first }}
          BROKER: ${{ matrix.broker }}
          CLIENT: ${{ matrix.client }}
        run: |
          set -euo pipefail
          tar -xzf "dist/nodkey_${VERSION}_linux_amd64.tar.gz" -C dist nodkey
          chmod 755 "previous/$N1/nodkey"
          bin() { if [ "$1" = n1 ]; then echo "$PWD/previous/$N1/nodkey"; else echo "$PWD/dist/nodkey"; fi; }
          export NODKEY_E2E_BROKER_BIN NODKEY_E2E_CLIENT_BIN
          NODKEY_E2E_BROKER_BIN="$(bin "$BROKER")"
          NODKEY_E2E_CLIENT_BIN="$(bin "$CLIENT")"
          if [ -n "$FIRST" ]; then
            export NODKEY_E2E_FIRST_BROKER_BIN
            NODKEY_E2E_FIRST_BROKER_BIN="$(bin "$FIRST")"
          fi
          echo "broker: $("$NODKEY_E2E_BROKER_BIN" version --offline), client: $("$NODKEY_E2E_CLIENT_BIN" version --offline), first broker: ${FIRST:-none}" | tee evidence.txt
          go test -race -count=1 -v -run '^TestEndToEnd$' -tags e2e ./test/e2e/... 2>&1 | tee -a evidence.txt
          # Check 5 must prove that the next broker took over.
          if [ -n "$FIRST" ] && ! grep -q 'next broker: nodkey .* goes on with the audit log of nodkey ' evidence.txt; then
            echo "::error::The end-to-end test did not run the next broker; check NODKEY_E2E_FIRST_BROKER_BIN." | tee -a evidence.txt
            exit 1
          fi
      - name: Result
        if: always()
        env:
          NAME: ${{ matrix.name }}
        run: |
          mkdir -p results
          sh scripts/release-check/fragment.sh "$NAME" "${{ steps.check.outcome == 'success' && 'pass' || 'fail' }}" evidence.txt "results/${{ matrix.check }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          # A re-run of the job replaces the result of the first run.
          overwrite: true
          name: result-e2e-${{ matrix.check }}
          path: results/

  # Check 7: the full suite, many times, with several CPU counts.
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install ssh and sshd for the SSH tests, and PyYAML
        # As in ci.yml.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openssh-client openssh-server python3-yaml
          sudo systemctl disable --now ssh.socket ssh.service || true
      - name: Check 7, stress
        id: check
        run: |
          set -euo pipefail
          go test -race -count=5 -cpu 1,2,4 -timeout 100m ./... 2>&1 | tee evidence.txt
      - name: Result
        if: always()
        run: |
          mkdir -p results
          sh scripts/release-check/fragment.sh "7 stress" "${{ steps.check.outcome == 'success' && 'pass' || 'fail' }}" evidence.txt results/7.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          # A re-run of the job replaces the result of the first run.
          overwrite: true
          name: result-stress
          path: results/

  # Check 8: the release notes name every pull request since N-1.
  changelog:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      N1: ${{ needs.build.outputs.n1 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check 8, changelog
        id: check
        run: |
          set -euo pipefail
          sh scripts/release-check/changelog.sh "$N1" "$VERSION" 2>&1 | tee evidence.txt
      - name: Result
        if: always()
        run: |
          mkdir -p results
          sh scripts/release-check/fragment.sh "8 changelog" "${{ steps.check.outcome == 'success' && 'pass' || 'fail' }}" evidence.txt results/8.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          # A re-run of the job replaces the result of the first run.
          overwrite: true
          name: result-changelog
          path: results/

  # Check 9: the timing report. It never fails the workflow: timing on
  # shared runners is not stable. A person reads it.
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check 9, timing report
        continue-on-error: true
        run: |
          set -euo pipefail
          NODKEY_TIMING_REPORT="$PWD/timing.json" go test -count=1 -run '^TestLoginTimingReport$' -v ./cmd/nodkey 2>&1 | tail -n 40
      - name: Result
        if: always()
        run: |
          mkdir -p results
          if [ ! -f timing.json ]; then echo "no timing report: the test could not measure; see the log of this job" >timing.json; fi
          sh scripts/release-check/fragment.sh "9 timing report" report timing.json results/9.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          # A re-run of the job replaces the result of the first run.
          overwrite: true
          name: result-timing
          path: results/

  # The result file: one JSON with each check, and the job summary.
  result:
    needs: [build, update-path, configs, e2e, stress, changelog, timing]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - name: Write the result file and the summary
        env:
          VERSION: ${{ needs.build.outputs.version }}
          N1: ${{ needs.build.outputs.n1 }}
          N2: ${{ needs.build.outputs.n2 }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(results/*.json)
          # Every check must have its result; a missing one counts as failed.
          jq -s --arg commit "$GITHUB_SHA" --arg branch "$GITHUB_REF_NAME" --arg version "$VERSION" \
            --arg n1 "$N1" --arg n2 "$N2" --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '
            (map(.check)) as $have
            | ([ "1 build", "2 N-1 and N-2", "3 update path", "4 configs", "5 audit log N-1 then candidate",
                 "6 candidate broker, candidate client", "6 N-1 broker, candidate client",
                 "6 candidate broker, N-1 client", "7 stress", "8 changelog", "9 timing report" ]
               | map(select(. as $c | $have | index($c) | not))
               | map({check: ., result: "fail", evidence: "no result: the job did not run or did not finish"})) as $missing
            | (. + $missing | sort_by(.check)) as $checks
            | {candidate: {commit: $commit, branch: $branch, version: $version}, n1: $n1, n2: $n2, run: $run,
               passed: ($checks | all(.result != "fail")), checks: $checks}' "${files[@]}" /dev/null >release-check.json
          {
            echo "## Release check of $VERSION"
            echo
            echo "Candidate: \`$GITHUB_SHA\` on \`$GITHUB_REF_NAME\`. N-1: ${N1:-?}, N-2: ${N2:-none}."
            echo
            echo "| check | result |"
            echo "|---|---|"
            jq -r '.checks[] | "| \(.check) | \(.result) |"' release-check.json
            echo
            echo "The timing report never fails the workflow. Read it:"
            echo
            echo '```json'
            jq -r '.checks[] | select(.check == "9 timing report") | .evidence' release-check.json
            echo '```'
            echo
            echo "Evidence of each check: the artifact release-check-result (release-check.json)."
          } >>"$GITHUB_STEP_SUMMARY"
          jq -e .passed release-check.json >/dev/null || { echo "::error::A check failed; see the summary and release-check.json."; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-check-result
          path: release-check.json
          if-no-files-found: error
